<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interval Quiz</title>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: #fafaf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: normal;
      color: #333;
      margin-bottom: 0.25rem;
      letter-spacing: 0.02em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1.75rem;
    }
    .card {
      background: #fff;
      border: 1px solid #e0e0d8;
      border-radius: 10px;
      padding: 1.5rem 2rem 2rem;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    #notation {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    #notation svg {
      max-width: 100%;
    }
    .input-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.55rem 0.75rem;
      font-size: 1rem;
      font-family: Georgia, serif;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      background: #fff;
      color: #222;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: #666; }
    button {
      padding: 0.55rem 1.1rem;
      font-size: 0.95rem;
      font-family: Georgia, serif;
      background: #3a3a3a;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #555; }
    button.secondary {
      background: transparent;
      color: #555;
      border: 1px solid #ccc;
    }
    button.secondary:hover { background: #f0f0ec; }
    .feedback {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      text-align: center;
      display: none;
    }
    .feedback.correct {
      display: block;
      background: #eaf6ec;
      color: #2a6e35;
      border: 1px solid #b2ddb8;
    }
    .feedback.incorrect {
      display: block;
      background: #fdf0f0;
      color: #8b2020;
      border: 1px solid #f0b8b8;
    }
    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .score {
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Interval Identification</h1>
  <p class="subtitle">Name the interval shown on the staff.</p>

  <div class="card">
    <div id="notation"></div>
    <div class="input-row">
      <input type="text" id="answer" placeholder="e.g. major 3rd, perfect 5th" autocomplete="off" />
      <button onclick="checkAnswer()">Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="bottom-row">
      <span class="score" id="score">Score: 0 / 0</span>
      <button class="secondary" onclick="nextQuestion()">Next question</button>
    </div>
  </div>

  <script>
    const { Renderer, Stave, StaveNote, Accidental, Voice, Formatter } = Vex.Flow;

    const intervals = [
      { keys: ['d/4', 'ab/4'], acc: { 1: 'b' }, answers: ['diminished fifth','dim fifth','diminished 5th','dim 5th','d5','tritone','augmented fourth','aug fourth','augmented 4th','aug 4th','a4'] },
      { keys: ['c/4', 'e/4'],  acc: {},          answers: ['major third','major 3rd','maj third','maj3'] },
      { keys: ['c/4', 'eb/4'], acc: { 1: 'b' },  answers: ['minor third','minor 3rd','min third','min3'] },
      { keys: ['c/4', 'g/4'],  acc: {},          answers: ['perfect fifth','perfect 5th','p5','perf fifth'] },
      { keys: ['c/4', 'f/4'],  acc: {},          answers: ['perfect fourth','perfect 4th','p4','perf fourth'] },
      { keys: ['c/4', 'a/4'],  acc: {},          answers: ['major sixth','major 6th','maj sixth','maj6'] },
      { keys: ['c/4', 'ab/4'], acc: { 1: 'b' },  answers: ['minor sixth','minor 6th','min sixth','min6'] },
      { keys: ['d/4', 'f/4'],  acc: {},          answers: ['minor third','minor 3rd','min third','min3'] },
      { keys: ['d/4', 'f#/4'], acc: { 1: '#' },  answers: ['major third','major 3rd','maj third','maj3'] },
      { keys: ['e/4', 'b/4'],  acc: {},          answers: ['perfect fifth','perfect 5th','p5'] },
      { keys: ['g/4', 'bb/4'], acc: { 1: 'b' },  answers: ['minor third','minor 3rd','min third','min3'] },
      { keys: ['a/4', 'c/5'],  acc: {},          answers: ['minor third','minor 3rd','min third','min3'] },
      { keys: ['c/4', 'b/4'],  acc: {},          answers: ['major seventh','major 7th','maj seventh','maj7'] },
      { keys: ['c/4', 'bb/4'], acc: { 1: 'b' },  answers: ['minor seventh','minor 7th','min seventh','min7'] },
      { keys: ['c/4', 'd/4'],  acc: {},          answers: ['major second','major 2nd','maj second','maj2','whole step','whole tone'] },
      { keys: ['c/4', 'c/5'],  acc: {},          answers: ['octave','perfect octave','p8'] },
      { keys: ['f/4', 'a/4'],  acc: {},          answers: ['major third','major 3rd','maj third','maj3'] },
      { keys: ['g/4', 'd/5'],  acc: {},          answers: ['perfect fifth','perfect 5th','p5'] },
      { keys: ['b/3', 'f/4'],  acc: {},          answers: ['diminished fifth','dim fifth','diminished 5th','dim 5th','d5','tritone'] },
      { keys: ['e/4', 'g/4'],  acc: {},          answers: ['minor third','minor 3rd','min third','min3'] },
    ];

    let current = null;
    let correct = 0;
    let total = 0;
    let answered = false;

    function normalize(s) {
      return s.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
    }

    function renderInterval(interval) {
      const container = document.getElementById('notation');
      container.innerHTML = '';

      const renderer = new Renderer(container, Renderer.Backends.SVG);
      renderer.resize(420, 160);
      const context = renderer.getContext();
      context.setFont('Arial', 10);

      const stave = new Stave(20, 20, 370);
      stave.addClef('treble');
      stave.setContext(context).draw();

      const chord = new StaveNote({
        keys: interval.keys,
        duration: 'w',
        clef: 'treble',
      });

      Object.entries(interval.acc).forEach(([idx, type]) => {
        chord.addAccidental(parseInt(idx), new Accidental(type));
      });

      const voice = new Voice({ num_beats: 4, beat_value: 4 });
      voice.setStrict(false);
      voice.addTickables([chord]);

      new Formatter().joinVoices([voice]).format([voice], 280);
      voice.draw(context, stave);
    }

    function pickQuestion() {
      const idx = Math.floor(Math.random() * intervals.length);
      current = intervals[idx];
    }

    function loadQuestion() {
      renderInterval(current);
      document.getElementById('answer').value = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('answer').focus();
      answered = false;
    }

    function checkAnswer() {
      if (answered) return;
      const val = document.getElementById('answer').value;
      if (!val.trim()) return;

      const norm = normalize(val);
      const isCorrect = current.answers.some(a => normalize(a) === norm);
      answered = true;
      total++;
      if (isCorrect) correct++;

      const fb = document.getElementById('feedback');
      const pretty = current.answers[0].charAt(0).toUpperCase() + current.answers[0].slice(1);
      fb.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
      fb.textContent = isCorrect
        ? 'Correct! ' + pretty + '.'
        : 'Not quite — the answer is: ' + pretty + '.';

      document.getElementById('score').textContent = 'Score: ' + correct + ' / ' + total;
    }

    function nextQuestion() {
      pickQuestion();
      loadQuestion();
    }

    document.getElementById('answer').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkAnswer();
    });

    pickQuestion();
    loadQuestion();
  </script>
</body>
</html>
