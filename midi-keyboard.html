<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Keyboard Display</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  h1 {
    font-weight: 500;
    letter-spacing: 0.05em;
    color: #aaa;
    margin-bottom: 1.5rem;
    text-transform: uppercase;
    font-size: 0.85rem;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    font-size: 0.875rem;
    color: #888;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #555;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.connected { background: #1D9E75; }
  .dot.error     { background: #E24B4A; }
  .dot.loading   { background: #EF9F27; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-bottom: 2rem;
    align-items: center;
  }

  .connect-btn {
    padding: 8px 20px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #ccc;
    font-size: 0.875rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .connect-btn:hover { background: #333; border-color: #666; }
  .connect-btn:disabled { opacity: 0.4; cursor: default; }

  .sound-toggle {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #888;
    font-size: 0.875rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .sound-toggle.on {
    border-color: #1D9E75;
    color: #1D9E75;
    background: #0d2b20;
  }
  .sound-toggle:hover { background: #333; }
  .sound-toggle.on:hover { background: #0d2b20; }

  /* ── Keyboard ── */
  .keyboard-outer {
    overflow-x: auto;
    padding-bottom: 12px;
    max-width: 100%;
  }

  .keyboard {
    position: relative;
    height: 200px;
  }

  .white-key {
    position: absolute;
    width: 36px;
    height: 200px;
    background: #f5f5f0;
    border: 1px solid #bbb;
    border-top: none;
    border-radius: 0 0 6px 6px;
    cursor: pointer;
    transition: background 0.05s;
    user-select: none;
  }
  .white-key:hover  { background: #e8e8e0; }
  .white-key.active { background: #7ab8f5; border-color: #3a8ee6; }

  .white-key .label {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #999;
    pointer-events: none;
    white-space: nowrap;
  }
  .white-key.active .label { color: #1a5fa8; }

  .black-key {
    position: absolute;
    width: 24px;
    height: 120px;
    background: #222;
    border: 1px solid #000;
    border-top: none;
    border-radius: 0 0 4px 4px;
    z-index: 2;
    cursor: pointer;
    transition: background 0.05s;
    user-select: none;
  }
  .black-key:hover  { background: #333; }
  .black-key.active { background: #378ADD; }

  /* ── Note display ── */
  .note-display {
    margin-top: 2rem;
    min-height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .note-pill {
    padding: 4px 14px;
    border-radius: 20px;
    background: #1a3a5c;
    border: 1px solid #378ADD;
    color: #7ab8f5;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .note-placeholder {
    font-size: 0.875rem;
    color: #555;
  }
</style>
</head>
<body>

<h1>MIDI Keyboard Display</h1>

<div class="status-bar">
  <div class="dot" id="dot"></div>
  <span id="status-text">No MIDI device connected</span>
</div>

<div class="btn-row">
  <button class="connect-btn" id="connect-btn" onclick="connectMidi()">Connect MIDI Device</button>
  <button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">Sound: Off</button>
  <button class="sound-toggle" id="accidental-toggle" onclick="toggleAccidentals()">Flats/Sharps: &#9839;</button>
  <button class="sound-toggle on" id="notes-toggle" onclick="toggleNotes()">Notes: On</button>
</div>

<div class="keyboard-outer">
  <div class="keyboard" id="keyboard"></div>
</div>

<div class="note-display" id="note-display">
  <span class="note-placeholder" id="placeholder">Play a note…</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
const NOTE_NAMES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_NAMES_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
let useFlats = false;
let showNotes = true;

const START_MIDI = 36; // C2
const END_MIDI   = 84; // C6

const WHITE_W = 36;
const BLACK_W = 24;

const SEMITONE_MAP = [
  { black: false }, // C
  { black: true  }, // C#
  { black: false }, // D
  { black: true  }, // D#
  { black: false }, // E
  { black: false }, // F
  { black: true  }, // F#
  { black: false }, // G
  { black: true  }, // G#
  { black: false }, // A
  { black: true  }, // A#
  { black: false }, // B
];

const activeNotes = new Set();
let midiAccess = null;
let sampler = null;
let samplerReady = false;
let soundOn = false;

function midiToName(midi) {
  const names = useFlats ? NOTE_NAMES_FLAT : NOTE_NAMES_SHARP;
  return names[midi % 12] + (Math.floor(midi / 12) - 1);
}

// ── Sampler ──────────────────────────────────────────────
function loadSampler() {
  const toggle = document.getElementById('sound-toggle');
  toggle.textContent = 'Sound: Loading…';
  toggle.disabled = true;

  sampler = new Tone.Sampler({
    urls: {
      C2: 'C2.mp3', 'D#2': 'Ds2.mp3', 'F#2': 'Fs2.mp3', A2: 'A2.mp3',
      C3: 'C3.mp3', 'D#3': 'Ds3.mp3', 'F#3': 'Fs3.mp3', A3: 'A3.mp3',
      C4: 'C4.mp3', 'D#4': 'Ds4.mp3', 'F#4': 'Fs4.mp3', A4: 'A4.mp3',
      C5: 'C5.mp3', 'D#5': 'Ds5.mp3', 'F#5': 'Fs5.mp3', A5: 'A5.mp3',
      C6: 'C6.mp3',
    },
    release: 1.5,
    baseUrl: 'https://tonejs.github.io/audio/salamander/',
    onload: () => {
      samplerReady = true;
      soundOn = true;
      toggle.textContent = 'Sound: On';
      toggle.classList.add('on');
      toggle.disabled = false;
    },
    onerror: (err) => {
      console.error('Sampler load error:', err);
      toggle.textContent = 'Sound: Error';
      toggle.disabled = false;
    }
  }).toDestination();
}

function toggleSound() {
  if (!sampler) {
    // First time — need to resume AudioContext (browser policy) then load
    Tone.start().then(() => loadSampler());
    return;
  }
  soundOn = !soundOn;
  const toggle = document.getElementById('sound-toggle');
  toggle.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
  toggle.classList.toggle('on', soundOn);
}

function toggleAccidentals() {
  useFlats = !useFlats;
  const btn = document.getElementById('accidental-toggle');
  btn.innerHTML = useFlats
    ? 'Flats/Sharps: &#9837;'
    : 'Flats/Sharps: &#9839;';
  btn.classList.toggle('on', useFlats);
  renderNotes();
}

function toggleNotes() {
  showNotes = !showNotes;
  const btn = document.getElementById('notes-toggle');
  btn.textContent = showNotes ? 'Notes: On' : 'Notes: Off';
  btn.classList.toggle('on', showNotes);
  document.getElementById('note-display').style.visibility = showNotes ? '' : 'hidden';
}
function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';

  let whiteIndex = 0;
  const positions = {};

  for (let midi = START_MIDI; midi <= END_MIDI; midi++) {
    const isBlack = SEMITONE_MAP[midi % 12].black;
    if (!isBlack) {
      positions[midi] = { black: false, x: whiteIndex * WHITE_W };
      whiteIndex++;
    } else {
      positions[midi] = { black: true, x: whiteIndex * WHITE_W - BLACK_W / 2 - 1 };
    }
  }

  kb.style.width = (whiteIndex * WHITE_W) + 'px';

  for (const pass of ['white', 'black']) {
    for (let midi = START_MIDI; midi <= END_MIDI; midi++) {
      const pos = positions[midi];
      if (pos.black !== (pass === 'black')) continue;

      const div = document.createElement('div');
      div.className = pos.black ? 'black-key' : 'white-key';
      div.dataset.midi = midi;
      div.style.left = pos.x + 'px';

      if (!pos.black && midi % 12 === 0) {
        const lbl = document.createElement('span');
        lbl.className = 'label';
        lbl.textContent = midiToName(midi);
        div.appendChild(lbl);
      }

      div.addEventListener('mousedown',  (e) => { e.preventDefault(); pressNote(midi, 80); });
      div.addEventListener('mouseup',    ()  => releaseNote(midi));
      div.addEventListener('mouseleave', ()  => { if (!midiAccess) releaseNote(midi); });
      div.addEventListener('touchstart', (e) => { e.preventDefault(); pressNote(midi, 80); }, { passive: false });
      div.addEventListener('touchend',   (e) => { e.preventDefault(); releaseNote(midi); },   { passive: false });

      kb.appendChild(div);
    }
  }
}

// ── Note on/off ───────────────────────────────────────────
function pressNote(midi, velocity = 80) {
  if (midi < START_MIDI || midi > END_MIDI) return;
  activeNotes.add(midi);
  const el = document.querySelector(`[data-midi="${midi}"]`);
  if (el) el.classList.add('active');
  renderNotes();

  if (soundOn && samplerReady) {
    const name = midiToName(midi);
    try { sampler.triggerAttack(name, Tone.now()); } catch(e) {}
  }
}

function releaseNote(midi) {
  if (!activeNotes.has(midi)) return;
  activeNotes.delete(midi);
  const el = document.querySelector(`[data-midi="${midi}"]`);
  if (el) el.classList.remove('active');
  renderNotes();

  if (soundOn && samplerReady) {
    const name = midiToName(midi);
    try { sampler.triggerRelease(name, Tone.now()); } catch(e) {}
  }
}

function renderNotes() {
  const display = document.getElementById('note-display');
  const placeholder = document.getElementById('placeholder');
  display.querySelectorAll('.note-pill').forEach(p => p.remove());

  if (activeNotes.size === 0) {
    placeholder.style.display = '';
    return;
  }
  placeholder.style.display = 'none';
  [...activeNotes].sort((a, b) => a - b).forEach(midi => {
    const pill = document.createElement('span');
    pill.className = 'note-pill';
    pill.textContent = midiToName(midi);
    display.appendChild(pill);
  });
}

// ── MIDI ──────────────────────────────────────────────────
function connectMidi() {
  if (!navigator.requestMIDIAccess) {
    setStatus('error', 'Web MIDI API not supported — use Chrome or Edge');
    return;
  }
  setStatus('loading', 'Requesting MIDI access…');
  navigator.requestMIDIAccess({ sysex: false }).then(access => {
    midiAccess = access;
    if (access.inputs.size === 0) {
      setStatus('error', 'No MIDI devices found — plug in your keyboard and try again');
      return;
    }
    setStatus('connected', `Connected — ${access.inputs.size} MIDI input(s) detected`);
    document.getElementById('connect-btn').disabled = true;
    document.getElementById('connect-btn').textContent = 'Connected';

    function attachInput(input) { input.onmidimessage = handleMidi; }
    access.inputs.forEach(attachInput);
    access.onstatechange = (e) => {
      if (e.port.type === 'input') {
        if (e.port.state === 'connected') {
          attachInput(e.port);
          setStatus('connected', `Connected — ${access.inputs.size} MIDI input(s)`);
        } else {
          setStatus('error', 'MIDI device disconnected');
        }
      }
    };
  }).catch(() => {
    setStatus('error', 'MIDI access denied — check browser permissions');
  });
}

function handleMidi(e) {
  const [status, note, velocity] = e.data;
  const cmd = status & 0xf0;
  if (cmd === 0x90 && velocity > 0) pressNote(note, velocity);
  else if (cmd === 0x80 || (cmd === 0x90 && velocity === 0)) releaseNote(note);
}

function setStatus(state, text) {
  const dot = document.getElementById('dot');
  dot.className = 'dot' + (state ? ' ' + state : '');
  document.getElementById('status-text').textContent = text;
}

buildKeyboard();
</script>
</body>
</html>
