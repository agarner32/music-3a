<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beaming Examples — Music 3A</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --plum-dark:   #5c4459;
      --plum:        #7a5f79;
      --plum-light:  #a688a5;
      --plum-pale:   #f0eaf0;
      --gold:        #c9a96e;
      --cream:       #fdfaf7;
      --cream-alt:   #f2ede8;
      --border:      #ddd6ce;
      --text:        #2e2830;
      --text-mid:    #5a5060;
      --red:         #c0392b;
      --green:       #2e7d52;
      --font-heading: 'Cormorant Garamond', Georgia, serif;
      --font-ui:      'DM Sans', Verdana, sans-serif;
    }

    html, body {
      background: var(--cream);
      font-family: var(--font-ui);
      color: var(--text);
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
    }

    /* ── CAROUSEL SHELL ── */
    .carousel {
      width: 100%;
      max-width: 820px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(90,64,89,0.08);
    }

    /* ── HEADER BAR ── */
    .carousel-header {
      background: linear-gradient(135deg, var(--plum-dark), var(--plum));
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .carousel-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .carousel-counter {
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.06em;
    }

    /* ── SLIDE AREA ── */
    .slide-area {
      padding: 28px 28px 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      position: relative;
    }

    /* Status badge */
    .slide-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      padding: 4px 14px;
      border-radius: 100px;
      align-self: flex-start;
    }

    .slide-badge.incorrect {
      background: #fdecea;
      color: var(--red);
      border: 1px solid #f5c6c2;
    }

    .slide-badge.correct {
      background: #e8f5ee;
      color: var(--green);
      border: 1px solid #b8dfc9;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Image */
    .slide-image-wrap {
      width: 100%;
      background: var(--cream-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
    }

    .slide-image-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Placeholder shown when no real image yet */
    .slide-placeholder {
      width: 100%;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--plum-light);
      font-size: 0.85rem;
      font-style: italic;
    }

    .slide-placeholder svg {
      opacity: 0.35;
    }

    /* Caption */
    .slide-caption {
      font-family: var(--font-ui);
      font-size: 0.93rem;
      color: var(--text-mid);
      line-height: 1.55;
      text-align: center;
      max-width: 600px;
      padding: 0 4px;
    }

    /* ── CONTROLS ── */
    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--cream);
    }

    .btn-arrow {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--plum-light);
      background: #fff;
      color: var(--plum);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
      font-size: 1rem;
    }

    .btn-arrow:hover:not(:disabled) {
      background: var(--plum);
      border-color: var(--plum);
      color: #fff;
      transform: scale(1.06);
    }

    .btn-arrow:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* Dot indicators */
    .dot-row {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.2s, transform 0.2s;
      cursor: pointer;
    }

    .dot.active {
      background: var(--plum);
      transform: scale(1.25);
    }

    /* ── FADE TRANSITION ── */
    .slide-area {
      transition: opacity 0.2s ease;
    }

    .slide-area.fading {
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="carousel" role="region" aria-label="Beaming examples">

  <div class="carousel-header">
    <span class="carousel-title">Beaming Examples</span>
    <span class="carousel-counter" id="counter">1 / 6</span>
  </div>

  <div class="slide-area" id="slideArea">
    <span class="slide-badge incorrect" id="badge">
      <span class="badge-dot"></span>
      <span id="badgeText">Incorrect</span>
    </span>
    <div class="slide-image-wrap" id="imageWrap">
      <!-- image or placeholder rendered by JS -->
    </div>
    <p class="slide-caption" id="caption"></p>
  </div>

  <div class="carousel-controls">
    <button class="btn-arrow" id="btnPrev" aria-label="Previous example" disabled>
      &#8592;
    </button>
    <div class="dot-row" id="dotRow"></div>
    <button class="btn-arrow" id="btnNext" aria-label="Next example">
      &#8594;
    </button>
  </div>

</div>

<script>
  // ============================================================
  // SLIDES — edit this array to add, remove, or reorder slides.
  // Each slide needs:
  //   type:    "incorrect" | "correct"
  //   image:   URL string, or "" to show a placeholder
  //   caption: Short description shown below the image
  // ============================================================
  const slides = [
    {
      type: "incorrect",
      image: "Beaming-1-incorrect.png",
      caption: "Incorrect (4/4): the four eighth notes are beamed as one group across beats 2 and 3 — there is no visual break between the two halves of the measure."
    },
    {
      type: "correct",
      image: "Beaming-2-correct.png",
      caption: "Correct (4/4): the beam is broken between beats 2 and 3. Each half of the measure contains exactly two beats — you could draw a vertical line right down the middle."
    },
    {
      type: "incorrect",
      image: "Beaming-3-incorrect.png",
      caption: "Incorrect (4/4): quarter, eighth, quarter, dotted quarter — beat 3 is not visible because no note attack falls on it. Even though the quarter note spans beat 3, the eye cannot find it at a glance."
    },
    {
      type: "correct",
      image: "Beaming-4-correct.png",
      caption: "Correct (4/4): rewritten as quarter, two beamed eighths, tied eighth, dotted quarter. Beat 3 is now visible as the tied eighth note — a note lands there even though it is held over. Two beats on each side of an invisible dividing line."
    },
    {
      type: "incorrect",
      image: "Beaming-5-incorrect.png",
      caption: "Incorrect (3/4): inconsistent beaming groups notes across beats, making it hard to see where beats 2 and 3 fall."
    },
    {
      type: "correct",
      image: "Beaming-6-correct.png",
      caption: "Correct (3/4): each beat is beamed separately. The three beat groups are immediately visible."
    }
  ];
  // ============================================================

  let current = 0;

  const slideArea  = document.getElementById("slideArea");
  const badge      = document.getElementById("badge");
  const badgeText  = document.getElementById("badgeText");
  const imageWrap  = document.getElementById("imageWrap");
  const caption    = document.getElementById("caption");
  const counter    = document.getElementById("counter");
  const btnPrev    = document.getElementById("btnPrev");
  const btnNext    = document.getElementById("btnNext");
  const dotRow     = document.getElementById("dotRow");

  // Build dots
  slides.forEach((_, i) => {
    const dot = document.createElement("button");
    dot.className = "dot" + (i === 0 ? " active" : "");
    dot.setAttribute("aria-label", "Go to slide " + (i + 1));
    dot.addEventListener("click", () => goTo(i));
    dotRow.appendChild(dot);
  });

  function render(index) {
    const s = slides[index];

    // Badge
    const isCorrect = s.type === "correct";
    badge.className = "slide-badge " + s.type;
    badgeText.textContent = isCorrect ? "Correct" : "Incorrect";

    // Image or placeholder
    if (s.image) {
      imageWrap.innerHTML = `<img src="${s.image}" alt="${s.caption}" />`;
    } else {
      imageWrap.innerHTML = `
        <div class="slide-placeholder">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="40" height="40" rx="6" stroke="#a688a5" stroke-width="2"/>
            <path d="M4 34l10-10 8 8 8-10 14 12" stroke="#a688a5" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="15" cy="18" r="4" stroke="#a688a5" stroke-width="2"/>
          </svg>
          <span>Image placeholder — add Canvas URL to slides array</span>
        </div>`;
    }

    // Caption
    caption.textContent = s.caption;

    // Counter
    counter.textContent = (index + 1) + " / " + slides.length;

    // Buttons
    btnPrev.disabled = index === 0;
    btnNext.disabled = index === slides.length - 1;

    // Dots
    dotRow.querySelectorAll(".dot").forEach((d, i) => {
      d.classList.toggle("active", i === index);
    });
  }

  function goTo(index) {
    slideArea.classList.add("fading");
    setTimeout(() => {
      current = index;
      render(current);
      slideArea.classList.remove("fading");
    }, 180);
  }

  btnPrev.addEventListener("click", () => { if (current > 0) goTo(current - 1); });
  btnNext.addEventListener("click", () => { if (current < slides.length - 1) goTo(current + 1); });

  // Initial render
  render(0);
</script>

</body>
</html>
